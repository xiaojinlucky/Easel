name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-skills:
    name: Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate skill metadata, layout and execution contracts
        run: python scripts/validate_skills.py
      - name: Check documented commands against real argparse schemas
        run: python scripts/validate_skill_commands.py

  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Easel and test dependencies
        run: python -m pip install -e . pytest
      - name: Run unit tests
        run: python -m pytest tests/ -v
