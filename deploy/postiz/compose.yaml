# Adapted from gitroomhq/postiz-docker-compose (AGPL-3.0); see UPSTREAM.json.
services:
  postiz:
    image: sha256:c2aa4199c49aca4442dbef49940afd8838b9481332f38b3338ce9abab79bea03
    restart: unless-stopped
    environment:
      MAIN_URL: http://localhost:4007
      FRONTEND_URL: http://localhost:4007
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4007/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET:?Run prepare_postiz.py}
      DATABASE_URL: postgresql://postiz-user:${POSTIZ_DB_PASSWORD:?Run prepare_postiz.py}@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'true'
      RUN_CRON: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      X_API_KEY: ''
      X_API_SECRET: ''
      LINKEDIN_CLIENT_ID: ''
      LINKEDIN_CLIENT_SECRET: ''
      REDDIT_CLIENT_ID: ''
      REDDIT_CLIENT_SECRET: ''
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      BEEHIIVE_API_KEY: ''
      BEEHIIVE_PUBLICATION_ID: ''
      THREADS_APP_ID: ''
      THREADS_APP_SECRET: ''
      FACEBOOK_APP_ID: ''
      FACEBOOK_APP_SECRET: ''
      YOUTUBE_CLIENT_ID: ''
      YOUTUBE_CLIENT_SECRET: ''
      TIKTOK_CLIENT_ID: ''
      TIKTOK_CLIENT_SECRET: ''
      PINTEREST_CLIENT_ID: ''
      PINTEREST_CLIENT_SECRET: ''
      DRIBBBLE_CLIENT_ID: ''
      DRIBBBLE_CLIENT_SECRET: ''
      DISCORD_CLIENT_ID: ''
      DISCORD_CLIENT_SECRET: ''
      DISCORD_BOT_TOKEN_ID: ''
      SLACK_ID: ''
      SLACK_SECRET: ''
      SLACK_SIGNING_SECRET: ''
      MASTODON_URL: https://mastodon.social
      MASTODON_CLIENT_ID: ''
      MASTODON_CLIENT_SECRET: ''
      OPENAI_API_KEY: ''
      NEXT_PUBLIC_DISCORD_SUPPORT: ''
      NEXT_PUBLIC_POLOTNO: ''
      API_LIMIT: 30
      FEE_AMOUNT: 0.05
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_SIGNING_KEY: ''
      STRIPE_SIGNING_KEY_CONNECT: ''
      NX_ADD_PLUGINS: false
    volumes:
    - postiz-config:/config/
    - postiz-uploads:/uploads/
    - ./patches/initialize.sentry.js:/app/apps/backend/dist/libraries/nestjs-libraries/src/sentry/initialize.sentry.js:ro
    - ./patches/initialize.sentry.js:/app/apps/orchestrator/dist/libraries/nestjs-libraries/src/sentry/initialize.sentry.js:ro
    ports:
    - 127.0.0.1:4007:5000
    networks:
    - postiz-network
    - temporal-network
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - Promise.all([5000,3000,3002].map(port=>new Promise((ok,no)=>{const r=require('http').get({hostname:'127.0.0.1',port,path:port===3002?'/health/status':'/'},res=>res.statusCode<500?ok():no());r.on('error',no);r.setTimeout(4000,()=>{r.destroy();no()})}))).then(()=>process.exit(0),()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
  postiz-postgres:
    image: sha256:ae8a26b5b27ef277b46284a0faa2f0059e36a0b40b4064e3353e1bbaaaa2b214
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
    - postgres-volume:/var/lib/postgresql/data
    networks:
    - postiz-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  postiz-redis:
    image: sha256:34763f95fb6f271efbe2b98e509bda93ba955217d45c36b9cb892238251d260b
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
    - postiz-redis-data:/data
    networks:
    - postiz-network
  spotlight:
    profiles:
    - debug
    pull_policy: always
    restart: unless-stopped
    ports:
    - 127.0.0.1:8969:8969/tcp
    image: ghcr.io/getsentry/spotlight:latest
    networks:
    - postiz-network
  temporal-elasticsearch:
    image: sha256:655ae298cc3ef10506c396124b2ff1bbd1a0006f0774fcdc3c2e237ec78eebb6
    restart: unless-stopped
    environment:
    - cluster.routing.allocation.disk.threshold_enabled=true
    - cluster.routing.allocation.disk.watermark.low=512mb
    - cluster.routing.allocation.disk.watermark.high=256mb
    - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms256m -Xmx256m
    - xpack.security.enabled=false
    networks:
    - temporal-network
    expose:
    - 9200
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
        || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
    - temporal-elasticsearch-data:/usr/share/elasticsearch/data
  temporal-postgresql:
    image: sha256:5d771498194daae8418b21d8e9f53a5d71d58021719660d5f4e838bd2f4ae8df
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_USER: temporal
    networks:
    - temporal-network
    expose:
    - 5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U temporal
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
    - temporal-postgres-data:/var/lib/postgresql/data
  temporal:
    restart: unless-stopped
    ports:
    - 127.0.0.1:7233:7233
    image: sha256:d6c65c64bf71dba5cfd89afeb9f618c532c197c02ad2bfad46d32e8d40a37c48
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
    - DB=postgres12
    - DB_PORT=5432
    - POSTGRES_USER=temporal
    - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
    - POSTGRES_SEEDS=temporal-postgresql
    - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    - ENABLE_ES=true
    - ES_SEEDS=temporal-elasticsearch
    - ES_VERSION=v7
    - TEMPORAL_NAMESPACE=default
    networks:
    - temporal-network
    healthcheck:
      test:
      - CMD
      - temporal
      - operator
      - cluster
      - health
      - --address
      - temporal:7233
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
    - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap
  temporal-admin-tools:
    image: sha256:55756051e72c866ed17040d157c9a133d8de3e5fe71a770232e600bc2883fa29
    restart: on-failure
    environment:
    - TEMPORAL_ADDRESS=temporal:7233
    - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
    - temporal-network
    stdin_open: true
    depends_on:
      temporal:
        condition: service_healthy
    tty: true
  temporal-ui:
    image: sha256:04210a5e9935efca43076b5fabb6925b915c7769b73a94d44df33cab8f404848
    restart: unless-stopped
    environment:
    - TEMPORAL_ADDRESS=temporal:7233
    - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    networks:
    - temporal-network
    ports:
    - 127.0.0.1:8088:8080
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      temporal:
        condition: service_healthy
  freshrss:
    image: sha256:b0bcc3186c9274b3b428a42657157293f499739640a9a03958de647d0a25fbe8
    restart: unless-stopped
    ports:
    - 127.0.0.1:8089:80
    environment:
      TZ: Asia/Shanghai
      CRON_MIN: '17'
      FRESHRSS_INSTALL: "--api-enabled --base-url http://localhost:8089 --db-type\
        \ sqlite --default-user easel --language zh-cn --title Easel\u8BA2\u9605\u5E93"
      FRESHRSS_USER: --user easel --password ${FRESHRSS_ADMIN_PASSWORD} --api-password
        ${FRESHRSS_API_PASSWORD} --language zh-cn
    volumes:
    - freshrss-data:/var/www/FreshRSS/data
    - freshrss-extensions:/var/www/FreshRSS/extensions
    networks:
    - postiz-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
    healthcheck:
      test:
      - CMD
      - php
      - -r
      - 'exit(@file_get_contents(''http://localhost/'')===false ? 1 : 0);'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  werss:
    image: sha256:cb3eafd10f02c66fe3fe49557ab0538c6cd0da1bf27e9ee498c1dd8b0236b743
    restart: unless-stopped
    expose:
    - 8001
    environment:
      DB: sqlite:////app/data/db.db
      PORT: '8001'
      USERNAME: easel
      PASSWORD: ${WERSS_ADMIN_PASSWORD:?Run prepare_postiz.py}
      SECRET_KEY: ${WERSS_SECRET_KEY:?Run prepare_postiz.py}
      ENABLE_JOB: 'True'
      WE_RSS.AUTH: 'False'
      ARTICLE_STATS_REFRESH_ENABLED: 'False'
      GATHER.CONTENT: 'False'
      GATHER.CONTENT_AUTO_CHECK: 'False'
      GATHER.MODEL: web
      RSS_FULL_CONTEXT: 'False'
      RSS_ADD_COVER: 'False'
      MAX_PAGE: '1'
      SPAN_INTERVAL: '60'
      REDIS_SERVER_ENABLED: 'False'
      REDIS_URL: ''
      PROXY_ENABLED: 'False'
      DEBUG: 'False'
      AUTO_RELOAD: 'False'
      THREADS: '1'
    volumes:
    - werss-data:/app/data
    - ./patches/werss-main.py:/app/main.py:ro
    - ./patches/werss-success.py:/app/driver/success.py:ro
    - ./patches/werss-auth.py:/app/apis/auth.py:ro
    networks:
    - postiz-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8001/',
        timeout=5).close()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    platform: linux/amd64
volumes:
  postgres-volume:
    external: false
  postiz-redis-data:
    external: false
  postiz-config:
    external: false
  postiz-uploads:
    external: false
  temporal-postgres-data:
    external: false
  temporal-elasticsearch-data:
    external: false
  freshrss-data: {}
  freshrss-extensions: {}
  werss-data: {}
networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
name: easel-postiz
