<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
.page{width:400px;height:533.3333px;flex-shrink:0;background:#fff;color:#1a1a1a;padding:32px;display:flex;flex-direction:column;overflow:hidden}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-shrink:0}
.av{width:32px;height:32px;border-radius:50%;background:#f0f0f0;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.name{font-size:14px;font-weight:600;line-height:1.3}.date{font-size:12px;color:#888;line-height:1.3}
.body{flex:1;min-height:0;font-size:15px;line-height:1.8;display:flex;flex-direction:column;gap:1.2em}
.body p{margin:0;white-space:pre-wrap;overflow-wrap:break-word;line-break:strict}
.body p.h{font-weight:700}b{font-weight:700}mark{background:#FFE58F;color:inherit;padding:0 2px}
.wm{margin-top:16px;padding-top:16px;border-top:1px solid #eee;text-align:right;font-size:12px;color:#bbb;flex-shrink:0}
</style></head><body></body></html>
