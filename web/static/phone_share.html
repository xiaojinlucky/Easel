<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>领取发布素材 · Easel</title>
<style>body{margin:0;background:#f7f5f0;color:#282825;font:16px/1.6 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:28px 20px 60px}h1{font-size:28px;margin:0}h2{font-size:15px;margin:0 0 12px}p{color:#66665e}section{background:white;border:1px solid #e4e2d9;border-radius:16px;padding:18px;margin:18px 0}textarea{box-sizing:border-box;width:100%;min-height:100px;max-height:340px;border:0;resize:vertical;font:inherit;background:#faf9f6;color:inherit;padding:10px}button,a{display:inline-block;border:0;background:#dbe59e;color:#242722;padding:10px 16px;border-radius:9px;font:inherit;text-decoration:none;margin-top:12px;cursor:pointer}img,video{display:block;max-width:100%;max-height:500px;margin:auto;border-radius:8px}#status{min-height:26px}</style>
<main><h1>领取发布素材</h1><p>先复制文案、按顺序保存图片或视频，再手动打开平台 App 检查并发布。领取不会自动发布。链接生成后30分钟有效，结束领取后立即失效。</p><p>手机需与电脑连接同一局域网。iPhone 可长按图片保存，视频可通过下方原文件入口保存；ZIP 下载后需在“文件”中解压。</p>{{CONTENT}}<a href="{{ZIP}}" download>下载全部素材与文案 ZIP</a><p id="status" role="status" aria-live="polite"></p></main>
<script>async function copy(button){const area=button.previousElementSibling,status=document.getElementById('status');try{if(window.isSecureContext&&navigator.clipboard){await navigator.clipboard.writeText(area.value);status.textContent='已复制，请到平台 App 粘贴。';return;}}catch(e){}area.focus();area.select();area.setSelectionRange(0,area.value.length);let copied=false;try{copied=document.execCommand('copy');}catch(e){}status.textContent=copied?'已复制，请到平台 App 粘贴。':'当前浏览器无法自动复制，文字已选中，请长按并选择“复制”。';}</script></html>
